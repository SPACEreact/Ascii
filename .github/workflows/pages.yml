name: Deploy ASCII Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html ./*.js _site/
          node -e 'const fs=require("fs");for(const m of fs.readFileSync("_site/index.html","utf8").matchAll(/<script src="\.\/(.*?)"/g)){const file="_site/"+m[1].split("?")[0];if(!fs.existsSync(file))throw Error("Missing deployed asset: "+file)}'
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
